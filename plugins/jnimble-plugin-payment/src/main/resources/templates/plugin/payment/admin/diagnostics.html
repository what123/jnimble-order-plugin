<!doctype html>
<html lang="zh-CN"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="#{payment.diagnostics.title}">支付诊断</title>
  <link rel="stylesheet" th:href="@{/assets/plugins/{pluginId}/payment.css(pluginId=${pluginId})}">
</head>
<body>
  <h1 layout:fragment="page-title" th:text="#{payment.diagnostics.title}">支付诊断</h1>

  <main layout:fragment="content">
    <section class="admin-page-section">
      <div class="admin-page-section__header">
        <div>
          <p class="admin-shell__eyebrow" th:text="#{plugin.payment.name}">收银</p>
          <h2 th:text="#{payment.diagnostics.list}">诊断事件列表</h2>
        </div>
      </div>

      <section class="admin-panel">
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
            <tr>
              <th th:text="#{payment.diagnostics.time}">时间</th>
              <th th:text="#{payment.diagnostics.eventType}">事件</th>
              <th th:text="#{payment.diagnostics.paymentId}">支付 ID</th>
              <th th:text="#{payment.diagnostics.orderId}">订单 ID</th>
              <th th:text="#{payment.diagnostics.status}">状态</th>
              <th th:text="#{payment.diagnostics.action}">操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="event : ${events}">
              <td th:text="${event.createdAt}">2026-01-01</td>
              <td th:text="${event.eventType}">PAYMENT</td>
              <td class="admin-code" th:text="${event.paymentId}">payment-id</td>
              <td class="admin-code" th:text="${event.orderId}">order-id</td>
              <td><span class="admin-status" th:text="${event.status}">SUCCEEDED</span></td>
              <td><a th:href="@{/admin/plugins/payment/diagnostics/{id}(id=${event.id})}" th:text="#{payment.diagnostics.view}">详情</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(events)}">
              <td colspan="6" class="admin-empty" th:text="#{payment.diagnostics.empty}">暂无诊断事件</td>
            </tr>
            </tbody>
          </table>
        </div>
      </section>
    </section>
  </main>
</body>
</html>
