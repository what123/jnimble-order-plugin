<!doctype html>
<html lang="zh-CN"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="#{printer-core.printers.add}">添加打印机</title>
  <link rel="stylesheet" th:href="@{/assets/plugins/{pluginId}/printer.css(pluginId=${pluginId})}">
</head>
<body>
  <h1 layout:fragment="page-title" th:text="#{printer-core.printers.add}">添加打印机</h1>

  <main layout:fragment="content">
    <section class="admin-page-section">
      <form id="printerForm" class="admin-form">
        <div class="admin-form__group">
          <label class="admin-form__label" th:text="#{printer-core.printers.name}">打印机名称</label>
          <input class="admin-input" type="text" name="name" required>
        </div>
        <div class="admin-form__group">
          <label class="admin-form__label" th:text="#{printer-core.printers.driver}">驱动</label>
          <select class="admin-input" name="driverId" required>
            <option value="" th:text="#{printer-core.printers.selectDriver}">Select a driver</option>
            <option th:each="driver : ${drivers}"
                    th:value="${driver.driverId}"
                    th:text="${#strings.containsIgnoreCase(driver.driverId, 'feie') ? #messages.msg('printer-core.driver.feie') : driver.driverName}">driver</option>
          </select>
        </div>
        <div class="admin-form__group">
          <label class="admin-form__label" th:text="#{printer-core.printers.type}">类型</label>
          <select class="admin-input" name="type">
            <option value="RECEIPT">RECEIPT</option>
            <option value="KITCHEN">KITCHEN</option>
          </select>
        </div>
        <div class="admin-form__actions">
          <button type="submit" class="admin-btn admin-btn--primary" th:text="#{printer-core.common.save}">Save</button>
          <a class="admin-btn" th:href="@{/admin/plugins/{pluginId}/printers(pluginId=${pluginId})}" th:text="#{printer-core.common.cancel}">Cancel</a>
        </div>
      </form>
    </section>
  </main>

  <script th:inline="javascript">
    document.getElementById('printerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());
      const resp = await fetch('/admin/plugins/printer-core/printers', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
      });
      const result = await resp.json();
      if (result.success) {
        window.location.href = '/admin/plugins/printer-core/printers';
      } else {
        alert(/*[[#{printer-core.printers.saveFailed}]]*/ 'Save failed');
      }
    });
  </script>
</body>
</html>
