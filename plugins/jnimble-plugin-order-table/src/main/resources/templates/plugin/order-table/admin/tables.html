<!doctype html>
<html lang="zh-CN"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="#{table.admin.title}">餐桌管理</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-ui@2.15/lib/theme-chalk/index.css">
  <style>
    [v-cloak] {
      display: none;
    }

    .table-management {
      min-width: 0;
    }

    .table-management__toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .table-management__summary {
      color: #606266;
      font-size: 14px;
      line-height: 32px;
    }

    .table-management__summary strong {
      color: #303133;
      font-variant-numeric: tabular-nums;
    }

    .table-management__actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .table-management__actions .el-button + .el-button {
      margin-left: 0;
    }

    .table-management .el-table {
      border-radius: 6px;
      overflow: hidden;
    }

    .table-management .el-table th.el-table__cell {
      background: #f6f7f9;
      color: #303133;
      font-weight: 600;
    }

    .table-management .el-table__empty-block {
      min-height: 180px;
    }

    .table-management__name {
      color: #303133;
      font-weight: 600;
    }

    .table-management__scan-code {
      color: #303133;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .table-create-dialog {
      border-radius: 6px;
    }

    .table-create-dialog .el-dialog__body {
      padding-top: 12px;
      padding-bottom: 8px;
    }

    .table-create-dialog .el-form-item__label {
      padding-bottom: 6px;
      color: #303133;
      font-weight: 600;
      line-height: 20px;
    }

    .table-create-dialog__party-size {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px;
    }

    .table-create-dialog .el-input-number {
      width: 100%;
    }

    @media (max-width: 640px) {
      .table-management__toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .table-management__actions {
        justify-content: flex-end;
        width: 100%;
      }

      .table-create-dialog {
        width: calc(100% - 24px) !important;
        margin-top: 4vh !important;
      }

      .table-create-dialog__party-size {
        grid-template-columns: minmax(0, 1fr);
        gap: 0;
      }
    }
  </style>
</head>
<body>
  <h1 layout:fragment="page-title" th:text="#{table.admin.title}">Table Management</h1>
  <main layout:fragment="content">
    <div id="tableManagementApp" class="table-management" v-cloak>
      <div class="table-management__toolbar">
        <span class="table-management__summary">
          {{ i18n.totalPrefix }} <strong>{{ tables.length }}</strong> {{ i18n.tablesUnit }}
        </span>
        <div class="table-management__actions">
          <el-tooltip content="Refresh table list" placement="top" th:attr="content=#{table.refresh}">
            <el-button size="small"
                       circle
                       icon="el-icon-refresh"
                       aria-label="Refresh table list"
                       th:attr="aria-label=#{table.refresh}"
                       :loading="loading"
                       @click="fetchTables"></el-button>
          </el-tooltip>
          <el-button type="primary" size="small" icon="el-icon-plus" @click="openCreateDialog">
            <span th:text="#{table.create}">Add Table</span>
          </el-button>
        </div>
      </div>

      <el-table :data="tables"
                :row-key="getRowKey"
                v-loading="loading"
                border
                stripe
                empty-text="No tables"
                th:attr="empty-text=#{table.empty}"
                style="width: 100%">
        <el-table-column label="Table Name" min-width="150" show-overflow-tooltip th:attr="label=#{table.name}">
          <template slot-scope="scope">
            <span class="table-management__name">{{ displayTableName(scope.row) }}</span>
          </template>
        </el-table-column>
        <el-table-column label="Area" prop="area" min-width="120" show-overflow-tooltip th:attr="label=#{table.area}">
          <template slot-scope="scope">
            {{ scope.row.area || '-' }}
          </template>
        </el-table-column>
        <el-table-column label="Minimum Guests" prop="minPartySize" width="120" align="center" th:attr="label=#{table.minPartySize}"></el-table-column>
        <el-table-column label="Maximum Guests" prop="maxPartySize" width="120" align="center" th:attr="label=#{table.maxPartySize}"></el-table-column>
        <el-table-column label="Scan Sequence" prop="scanCode" min-width="190" th:attr="label=#{table.scanCode}">
          <template slot-scope="scope">
            <span class="table-management__scan-code">{{ scope.row.scanCode || '-' }}</span>
          </template>
        </el-table-column>
        <el-table-column label="Status" width="100" align="center" th:attr="label=#{table.status}">
          <template slot-scope="scope">
            <el-tag :type="statusType(scope.row.status)" size="small" effect="plain">
              {{ statusText(scope.row.status) }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column label="Created At" min-width="150" th:attr="label=#{table.createdAt}">
          <template slot-scope="scope">
            {{ formatDateTime(scope.row.createdAt) }}
          </template>
        </el-table-column>
      </el-table>

      <el-dialog title="Add Table"
                 th:attr="title=#{table.create}"
                 custom-class="table-create-dialog"
                 :visible.sync="createDialogVisible"
                 width="520px"
                 :close-on-click-modal="false"
                 :close-on-press-escape="!saving"
                 :show-close="!saving"
                 @closed="resetCreateForm">
        <el-form ref="createForm"
                 :model="form"
                 :rules="rules"
                 label-position="top"
                 size="small">
          <el-form-item label="Table Name" prop="tableName" th:attr="label=#{table.name}">
            <el-input v-model.trim="form.tableName"
                      maxlength="100"
                      show-word-limit
                      autocomplete="off"
                      placeholder="e.g. Hall 1" th:attr="placeholder=#{table.name.placeholder}"></el-input>
          </el-form-item>

          <el-form-item label="Area" prop="area" th:attr="label=#{table.area}">
            <el-input v-model.trim="form.area"
                      maxlength="50"
                      autocomplete="off"
                      placeholder="e.g. First-floor hall" th:attr="placeholder=#{table.area.placeholder}"></el-input>
          </el-form-item>

          <div class="table-create-dialog__party-size">
            <el-form-item label="Minimum Guests" prop="minPartySize" th:attr="label=#{table.minPartySize}">
              <el-input-number v-model="form.minPartySize"
                               :min="1"
                               :step="1"
                               :precision="0"
                               controls-position="right"
                               @change="validatePartySize"></el-input-number>
            </el-form-item>
            <el-form-item label="Maximum Guests" prop="maxPartySize" th:attr="label=#{table.maxPartySize}">
              <el-input-number v-model="form.maxPartySize"
                               :min="1"
                               :step="1"
                               :precision="0"
                               controls-position="right"></el-input-number>
            </el-form-item>
          </div>
        </el-form>

        <span slot="footer" class="dialog-footer">
          <el-button size="small" :disabled="saving" @click="createDialogVisible = false" th:text="#{table.cancel}">Cancel</el-button>
          <el-button type="primary" size="small" :loading="saving" @click="handleCreate" th:text="#{table.save}">Save</el-button>
        </span>
      </el-dialog>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/element-ui@2.15/lib/index.js"></script>
    <th:block th:replace="~{fragment/element-locale :: scripts}" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script th:inline="javascript">
      (function () {
        var csrfToken = /*[[${_csrf.token}]]*/ '';
        var csrfHeader = /*[[${_csrf.headerName}]]*/ 'X-CSRF-TOKEN';
        var tableManagementApp;
        var tableI18n = {
          totalPrefix: /*[[#{table.totalPrefix}]]*/ 'Total',
          tablesUnit: /*[[#{table.tablesUnit}]]*/ 'tables',
          maxRequired: /*[[#{table.maxPartySize.required}]]*/ 'Enter the maximum guests',
          maxLessThanMin: /*[[#{table.maxPartySize.lessThanMin}]]*/ 'Maximum guests cannot be less than minimum guests',
          nameRequired: /*[[#{table.name.required}]]*/ 'Enter a table name',
          nameTooLong: /*[[#{table.name.tooLong}]]*/ 'Table name cannot exceed 100 characters',
          minRequired: /*[[#{table.minPartySize.required}]]*/ 'Enter the minimum guests',
          minInvalid: /*[[#{table.minPartySize.invalid}]]*/ 'Minimum guests must be at least 1',
          maxInvalid: /*[[#{table.maxPartySize.invalid}]]*/ 'Maximum guests must be at least 1',
          loadFailed: /*[[#{table.loadFailed}]]*/ 'Failed to load tables',
          createFailed: /*[[#{table.createFailed}]]*/ 'Failed to create table',
          created: /*[[#{table.created}]]*/ 'Table created',
          free: /*[[#{table.status.FREE}]]*/ 'Free',
          occupied: /*[[#{table.status.OCCUPIED}]]*/ 'Occupied',
          reserved: /*[[#{table.status.RESERVED}]]*/ 'Reserved',
          cleaning: /*[[#{table.status.CLEANING}]]*/ 'Cleaning'
        };

        function createDefaultForm() {
          return {
            tableName: '',
            area: '',
            minPartySize: 1,
            maxPartySize: 4
          };
        }

        function validateMaxPartySize(rule, value, callback) {
          if (value === null || value === undefined) {
            callback(new Error(tableI18n.maxRequired));
            return;
          }
          if (tableManagementApp && Number(value) < Number(tableManagementApp.form.minPartySize)) {
            callback(new Error(tableI18n.maxLessThanMin));
            return;
          }
          callback();
        }

        axios.defaults.baseURL = '/admin/plugins/order-table';
        axios.defaults.headers.common[csrfHeader] = csrfToken;

        tableManagementApp = new Vue({
          el: '#tableManagementApp',
          data: function () {
            return {
              i18n: tableI18n,
              tables: [],
              loading: false,
              saving: false,
              createDialogVisible: false,
              form: createDefaultForm(),
              rules: {
                tableName: [
                  { required: true, message: tableI18n.nameRequired, trigger: 'blur' },
                  { max: 100, message: tableI18n.nameTooLong, trigger: 'blur' }
                ],
                minPartySize: [
                  { required: true, message: tableI18n.minRequired, trigger: 'change' },
                  { type: 'number', min: 1, message: tableI18n.minInvalid, trigger: 'change' }
                ],
                maxPartySize: [
                  { required: true, message: tableI18n.maxRequired, trigger: 'change' },
                  { type: 'number', min: 1, message: tableI18n.maxInvalid, trigger: 'change' },
                  { validator: validateMaxPartySize, trigger: 'change' }
                ]
              }
            };
          },
          created: function () {
            this.fetchTables();
          },
          methods: {
            fetchTables: function () {
              var self = this;
              self.loading = true;
              axios.get('/tables/list').then(function (response) {
                self.tables = Array.isArray(response.data) ? response.data : [];
              }).catch(function () {
                self.$message.error(self.i18n.loadFailed);
              }).finally(function () {
                self.loading = false;
              });
            },
            openCreateDialog: function () {
              this.form = createDefaultForm();
              this.createDialogVisible = true;
              this.$nextTick(function () {
                if (this.$refs.createForm) {
                  this.$refs.createForm.clearValidate();
                }
              });
            },
            resetCreateForm: function () {
              this.saving = false;
              this.form = createDefaultForm();
              if (this.$refs.createForm) {
                this.$refs.createForm.clearValidate();
              }
            },
            validatePartySize: function () {
              if (this.$refs.createForm) {
                this.$refs.createForm.validateField('maxPartySize');
              }
            },
            handleCreate: function () {
              var self = this;
              this.$refs.createForm.validate(function (valid) {
                if (!valid) {
                  return;
                }

                var payload = new URLSearchParams();
                payload.append('tableName', self.form.tableName);
                payload.append('area', self.form.area || '');
                payload.append('minPartySize', String(self.form.minPartySize));
                payload.append('maxPartySize', String(self.form.maxPartySize));

                self.saving = true;
                axios.post('/tables', payload, {
                  headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' }
                }).then(function (response) {
                  if (!response.data || response.data.success !== true) {
                    throw new Error(self.i18n.createFailed);
                  }
                  self.createDialogVisible = false;
                  self.$message.success(self.i18n.created);
                  self.fetchTables();
                }).catch(function (error) {
                  self.$message.error(self.i18n.createFailed);
                }).finally(function () {
                  self.saving = false;
                });
              });
            },
            getRowKey: function (row) {
              return row.scanCode || row.id;
            },
            displayTableName: function (row) {
              return row.tableName || row.code || '-';
            },
            statusText: function (status) {
              return {
                FREE: this.i18n.free,
                OCCUPIED: this.i18n.occupied,
                RESERVED: this.i18n.reserved,
                CLEANING: this.i18n.cleaning
              }[status] || status || '-';
            },
            statusType: function (status) {
              return {
                FREE: 'success',
                OCCUPIED: 'warning',
                RESERVED: 'info',
                CLEANING: 'danger'
              }[status] || 'info';
            },
            formatDateTime: function (value) {
              if (!value) {
                return '-';
              }
              if (Array.isArray(value)) {
                var parts = value.slice(0, 5).map(function (part, index) {
                  return index === 0 ? String(part) : String(part).padStart(2, '0');
                });
                return parts[0] + '-' + parts[1] + '-' + parts[2] + ' ' + parts[3] + ':' + parts[4];
              }
              return String(value).replace('T', ' ').slice(0, 16);
            }
          }
        });
      })();
    </script>
  </main>
</body>
</html>
